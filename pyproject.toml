[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "semi-automated-research-system"
version = "0.1.0"
description = "Crash-recoverable control plane for semi-automated research"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "httpx>=0.27,<1",
  "pydantic>=2.10,<3",
  "PyYAML>=6,<7",
  "SQLAlchemy>=2.0,<3",
]

[project.optional-dependencies]
dev = [
  "pytest>=8,<10",
  "pytest-asyncio>=0.24,<2",
]

[project.scripts]
research-controller = "research_controller.cli:main"
research-runner = "research_controller.runner.__main__:main"

[tool.hatch.build.targets.wheel]
packages = ["src/research_controller"]

[tool.pytest.ini_options]
addopts = "-ra"
asyncio_mode = "auto"
testpaths = ["tests"]
markers = [
  "hermes_integration: opt-in tests that call a real Hermes API server",
  "codex_integration: opt-in tests that call a real Codex model",
]
